# PS Remote screen relay Worker (PS 1.77). NOT deployed yet: deploy only on the developer's yes (remote-anywhere-177.md).
# No secret lives in this file. Set them with:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
#   npx wrangler secret put PS_RELAY_KEY
name = "ps-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
