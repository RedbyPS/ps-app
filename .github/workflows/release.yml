# The G Squad release build (PS V1.58, the design, section 5).
#
# When: a shared version is claimed (tools/claim-version.mjs pushes an annotated tag v1.59 with
#   {"by": "jan", "kind": "shared"} on a commit of main). The tag push runs release-request.yml; when that finishes,
#   GitHub runs THIS file as it is on main. A "private" tag builds nothing here.
# Off until the developer switches it on: the repository variable GSQUAD_RELEASES must be "on" (hand over note).
#
# Order, and who holds a key:
#   claim        the tag is a shared claim on a commit of main               no key
#   checks       checks.yml again, on exactly that commit                    no key
#   build mac    the G Squad tree built into an UNSIGNED PS.app              no key
#   build phone  the G Squad tree built into an UNSIGNED APK                 no key
#   sign mac     signs PS.app, makes the signed update note                  G Squad Mac keys (environment gsquad-release)
#   sign phone   signs the APK, makes the phone note                         G Squad phone key (environment gsquad-release)
#   publish      a release on the G Squad channel repo, marked latest        bot token for that repo (environment ps-bot)
# The build jobs run the shared code; the jobs with keys run only files that are protected (protected-check.mjs).
# Both environments only accept runs on main, so a branch or a fork can never reach a key.
name: G Squad release

on:
  workflow_run:
    workflows: ["Release request"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build again (v1.59). Runs only from main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gsquad-release
  cancel-in-progress: false

env:
  NODE_VERSION: "26"

jobs:
  claim:
    name: claim
    if: >-
      vars.GSQUAD_RELEASES == 'on' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.claim.outputs.build }}
      tag: ${{ steps.claim.outputs.tag }}
      sha: ${{ steps.claim.outputs.sha }}
      version: ${{ steps.claim.outputs.version }}
      by: ${{ steps.claim.outputs.by }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Is it a shared release on main?
        id: claim
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          WANT: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          git fetch --force --tags origin
          node .github/scripts/release-claim.mjs . "$TAG" ${WANT:+"$WANT"}

  checks:
    name: checks
    needs: claim
    if: needs.claim.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.claim.outputs.sha }}

  build-mac:
    name: build mac
    needs: [claim, checks]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web packages
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Stamp the version
        env:
          VERSION: ${{ needs.claim.outputs.version }}
          BY: ${{ needs.claim.outputs.by }}
        run: node .github/scripts/stamp-version.mjs . "$VERSION" "$BY" "$GITHUB_RUN_ATTEMPT"
      # mac/build.sh with no signing keychain signs ad hoc; the real signature comes in "sign mac".
      - name: Build the G Squad Mac app (unsigned)
        env:
          NO_INSTALL: "1"
        run: node tools/build.mjs gsquad mac
      - name: Pack the build
        run: |
          set -euo pipefail
          APP=.build/gsquad/mac/build/PS.app; WEB=.build/gsquad/web/dist-ps
          [ -d "$APP" ] && [ -d "$WEB" ] || { echo "STOP: tools/build.mjs left no $APP or $WEB"; exit 1; }
          cp web/ps-version.json "$WEB/ps-version.json"
          mkdir -p pack
          # Only the approved notes (ps-public.mjs prints nothing for words the developer has not approved).
          node web/scripts/ps-public.mjs notes-text > pack/notes.txt 2>/dev/null || : > pack/notes.txt
          node web/scripts/ps-public.mjs history-json > pack/history.json 2>/dev/null || echo '[]' > pack/history.json
          ditto "$APP" pack/PS.app
          ditto "$WEB" pack/dist-ps
          tar -czf mac-unsigned.tgz -C pack .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-unsigned
          path: mac-unsigned.tgz
          retention-days: 3
          if-no-files-found: error

  build-phone:
    name: build phone
    needs: [claim, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web packages
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Android platform for compileSdk
        run: |
          sdk="$(sed -n 's/.*compileSdk *= *\([0-9][0-9]*\).*/\1/p' phone/app/build.gradle.kts | head -1)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$sdk" > /dev/null
      - name: Stamp the version
        env:
          VERSION: ${{ needs.claim.outputs.version }}
          BY: ${{ needs.claim.outputs.by }}
        run: node .github/scripts/stamp-version.mjs . "$VERSION" "$BY" "$GITHUB_RUN_ATTEMPT"
      # The app pins its update key by the certificate's SHA-256, which is public. Only that goes in here: with no
      # storeFile Gradle builds an unsigned APK, and the key itself stays in "sign phone".
      - name: The pinned certificate only (no key)
        env:
          CERT: ${{ vars.GSQUAD_GOS_CERT_SHA256 }}
        run: |
          [ -n "$CERT" ] || { echo "STOP: the variable GSQUAD_GOS_CERT_SHA256 is not set"; exit 1; }
          mkdir -p ~/.ps-gos-signing
          printf 'certSha256=%s\n' "$(printf '%s' "$CERT" | tr -d ': ' | tr 'A-F' 'a-f')" > ~/.ps-gos-signing/keystore.properties
      - name: Build the G Squad phone app (unsigned)
        run: node tools/build.mjs gsquad phone
      - name: Pack the build
        run: |
          set -euo pipefail
          APK=.build/gsquad/phone/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || { echo "STOP: tools/build.mjs left no $APK"; exit 1; }
          mkdir -p phone-unsigned
          cp "$APK" phone-unsigned/
          cp phone/version.properties phone-unsigned/
          node web/scripts/ps-public.mjs notes-text > phone-unsigned/notes.txt 2>/dev/null || : > phone-unsigned/notes.txt
          node web/scripts/ps-public.mjs history-json > phone-unsigned/history.json 2>/dev/null || echo '[]' > phone-unsigned/history.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-unsigned
          path: phone-unsigned
          retention-days: 3
          if-no-files-found: error

  sign-mac:
    name: sign mac
    needs: [claim, build-mac, build-phone]
    runs-on: macos-latest
    timeout-minutes: 20
    environment: gsquad-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-unsigned
          path: in
      - name: Sign and make the update note
        env:
          GSQUAD_MAC_CERT_P12: ${{ secrets.GSQUAD_MAC_CERT_P12 }}
          GSQUAD_MAC_CERT_PASSWORD: ${{ secrets.GSQUAD_MAC_CERT_PASSWORD }}
          GSQUAD_UPDATE_KEY: ${{ secrets.GSQUAD_UPDATE_KEY }}
        run: bash .github/scripts/gsquad-sign-mac.sh . in/mac-unsigned.tgz signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-signed
          path: signed
          retention-days: 3
          if-no-files-found: error

  sign-phone:
    name: sign phone
    needs: [claim, build-mac, build-phone]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: gsquad-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim.outputs.sha }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-unsigned
          path: in
      - name: Sign and make the phone note
        env:
          GSQUAD_GOS_KEYSTORE: ${{ secrets.GSQUAD_GOS_KEYSTORE }}
          GSQUAD_GOS_KEYSTORE_PASSWORD: ${{ secrets.GSQUAD_GOS_KEYSTORE_PASSWORD }}
          GSQUAD_GOS_KEY_ALIAS: ${{ secrets.GSQUAD_GOS_KEY_ALIAS }}
          GSQUAD_GOS_KEY_PASSWORD: ${{ secrets.GSQUAD_GOS_KEY_PASSWORD }}
          GSQUAD_GOS_CERT_SHA256: ${{ vars.GSQUAD_GOS_CERT_SHA256 }}
          BY: ${{ needs.claim.outputs.by }}
        run: bash .github/scripts/gsquad-sign-phone.sh in signed "$BY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-signed
          path: signed
          retention-days: 3
          if-no-files-found: error

  publish:
    name: publish
    needs: [claim, sign-mac, sign-phone]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ps-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim.outputs.sha }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-signed"
          path: signed
          merge-multiple: true
      - name: Channel repo
        id: channel
        env:
          CHANNEL: ${{ vars.PS_CHANNEL_REPO }}
        run: |
          [[ "$CHANNEL" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "STOP: the variable PS_CHANNEL_REPO is not owner/name"; exit 1; }
          echo "owner=${CHANNEL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${CHANNEL#*/}" >> "$GITHUB_OUTPUT"
      # A token for the channel repo only (the bot app is installed there with Contents write).
      - name: Bot token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PS_BOT_PRIVATE_KEY }}
          owner: ${{ steps.channel.outputs.owner }}
          repositories: ${{ steps.channel.outputs.name }}
          permission-contents: write
      - name: Publish to the G Squad channel
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PS_CHANNEL_REPO: ${{ vars.PS_CHANNEL_REPO }}
          TAG: ${{ needs.claim.outputs.tag }}
        run: node .github/scripts/gsquad-publish.mjs signed "$TAG"
