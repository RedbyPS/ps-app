# Safety checks: nothing private, no secret, no personal path, no change to the checks themselves.
#
# pull_request_target: GitHub runs THIS file as it is on main, never the pull request's copy, so a pull request can
# not switch these checks off. The pull request's files are only READ here (git archive into a plain folder):
# nothing from the pull request is installed, built or run. That is what makes it safe to give the term audit its
# secret word list, even for a pull request from a fork.
#
# Required checks on main (see the hand over note): "protected files", "term audit", "source audit".
name: Safety

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Branches whose pull requests may change the protected files (the checks, the release machinery). A ruleset lets
  # only the developer push branches that start with this (hand over note, setting 4).
  OWNER_BRANCH_PREFIX: red/

jobs:
  protected:
    name: protected files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Main's checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - name: The pull request (read only)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Files the checks and the release depend on
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          git -C pr fetch --no-tags --depth=1 origin "$BASE_SHA"
          node base/.github/scripts/protected-check.mjs pr "$BASE_SHA" "$HEAD_SHA" "$HEAD_REF" "$HEAD_REPO" "$BASE_REPO" "$OWNER_BRANCH_PREFIX"
      - name: Merge queue
        if: github.event_name == 'merge_group'
        run: echo "Every pull request in the queue passed this check on its own before it joined."

  terms:
    name: term audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The word list is an environment secret that only main may read (hand over note, environment term-audit).
    environment: term-audit
    steps:
      - name: Main's checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - name: The pull request's files (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: The tree as plain files
        run: mkdir tree && git -C pr archive HEAD | tar -x -C tree
      # The list is too big for one secret (48 KB each): gzip, base64, split into PS_PRIVATE_TERMS_1, _2, ... and
      # joined here with no separator. Part 1 missing means nothing could be checked: the audit fails.
      # The words go into a file in the runner's temp folder (never into the log) and are deleted at the end.
      - name: The private word list
        env:
          P1: ${{ secrets.PS_PRIVATE_TERMS_1 }}
          P2: ${{ secrets.PS_PRIVATE_TERMS_2 }}
          P3: ${{ secrets.PS_PRIVATE_TERMS_3 }}
          P4: ${{ secrets.PS_PRIVATE_TERMS_4 }}
        run: |
          set -euo pipefail
          [ -n "$P1" ] || { echo "BLOCK the private word list (secret PS_PRIVATE_TERMS_1) is not set: nothing could be checked"; exit 1; }
          ( umask 077; printf '%s%s%s%s' "$P1" "$P2" "$P3" "$P4" | base64 -d | gunzip > "$RUNNER_TEMP/terms.txt" )
          echo "word list: $(grep -c . "$RUNNER_TEMP/terms.txt") lines"
      - name: Private words and paths
        run: PS_PRIVATE_TERMS_FILE="$RUNNER_TEMP/terms.txt" node base/.github/scripts/tree-check.mjs terms tree
      - name: Private words in the pull request's commit messages and file history
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git -C pr fetch --no-tags origin "$BASE_SHA"
          mkdir -p history
          printf '%s\n%s\n%s\n' "$PR_TITLE" "$HEAD_REF" "$PR_BODY" > history/pull-request.txt
          git -C pr log --format='%an %ae%n%cn %ce%n%B' "$BASE_SHA..$HEAD_SHA" > history/commits.txt
          # Only the lines the pull request adds (taking a word OUT must never be blocked).
          git -C pr log -p --no-color --format= --unified=0 "$BASE_SHA..$HEAD_SHA" | grep '^+' > history/changes.txt || true
          PS_PRIVATE_TERMS_FILE="$RUNNER_TEMP/terms.txt" node base/.github/scripts/tree-check.mjs terms history
      - name: Delete the word list
        if: always()
        run: rm -f "$RUNNER_TEMP/terms.txt"

  source:
    name: source audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Main's checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - name: The pull request's files (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: The tree as plain files
        run: mkdir tree && git -C pr archive HEAD | tar -x -C tree
      - name: Personal paths and private files
        run: node base/.github/scripts/tree-check.mjs paths tree
      - name: No long dashes
        run: node base/.github/scripts/tree-check.mjs dashes tree
      - name: Plug points are still placeholders
        run: node base/.github/scripts/tree-check.mjs plugpoints tree
      - name: Feature registry
        run: node base/.github/scripts/tree-check.mjs registry tree
      # main's audit.py and its BLOCK list, on the pull request's files.
      - name: audit.py --source
        run: python3 -I base/mac/release/audit.py --source tree
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Built from source by version: the Go checksum database proves it is the published gitleaks.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: gitleaks on the files (main's .gitleaks.toml)
        run: gitleaks dir tree --config base/.gitleaks.toml --redact --no-banner
      - name: gitleaks on the pull request's commits (a secret added and taken out again is still public)
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C pr fetch --no-tags origin "$BASE_SHA"
          gitleaks git pr --config base/.gitleaks.toml --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"
